<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SpaceAntGalaxy</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;700&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head><body>
<canvas id="stars"></canvas><div id="app"></div>
<script type="module">
import {auth,A,$,esc,fmt,ld,gd,sv,rm,getCfg,stars}from'./firebase.js';
let me=null,V={p:'home'},cfg={},msg='',mode='customer',reg=false,cart={shop:null,items:[]};
try{cart=JSON.parse(sessionStorage.getItem('c'))||cart}catch(e){}
const DAY=864e5,save=()=>{try{sessionStorage.setItem('c',JSON.stringify(cart))}catch(e){}};
const go=(p,id)=>{V={p,id};msg='';render();scrollTo(0,0)};
const setMode=m=>{mode=m;render()},togReg=()=>{reg=!reg;render()};
const out=async()=>{await A.signOut(auth);cart={shop:null,items:[]};save();me=null;go('home')};
const nav=()=>`<nav><span class="brand" onclick="go('home')">SpaceAntGalaxy</span><div><a onclick="go('home')">Shops</a>${me?.role==='customer'?`<a onclick="go('cart')">Cart (${cart.items.reduce((a,i)=>a+i.q,0)})</a><a onclick="go('orders')">My orders</a>`:''}${me?.role==='owner'?`<a onclick="go('dash')">My shop</a>`:''}${me?`<a onclick="out()">Sign out (${esc(me.name)})</a>`:`<a onclick="go('login')">Sign in</a>`}</div></nav>`;
async function render(){const a=$('#app');a.innerHTML=nav()+'<p class="mut">Loading…</p>';let b;try{b=await({home,login,shop,cart:cartV,orders,dash}[V.p])()}catch(e){console.error(e);b='<p class="err">Something went wrong: '+esc(e.code||e.message)+'</p>'}a.innerHTML=nav()+(msg?`<div class="err">${esc(msg)}</div>`:'')+b}
const stars5=r=>{r=Math.round(r);return'<span class="star">'+'★'.repeat(r)+'☆'.repeat(5-r)+'</span>'};
async function avg(id){const rv=await ld('reviews','shopId',id);return{n:rv.length,a:rv.length?rv.reduce((s,x)=>s+x.rating,0)/rv.length:0,rv}}
const live=s=>!s.banned&&(!cfg.subOn||s.paidUntil>Date.now());
async function home(){const sh=(await ld('shops')).filter(live);let c='';for(const s of sh){const r=await avg(s.id);c+=`<div class="card click" onclick="go('shop','${s.id}')"><h3>${esc(s.name)}</h3><p class="mut">${esc(s.desc)}</p>${r.n?stars5(r.a)+` <span class="mut">(${r.n})</span>`:'<span class="mut">No reviews yet</span>'}</div>`}
 return`<div class="hero"><h1>SpaceAntGalaxy</h1><p>A galaxy of independent shops. Browse, order, and pay on delivery.</p></div><h2>Shops</h2><div class="grid">${c||'<p class="mut">No shops have opened yet.</p>'}</div>`}
const login=()=>`<div class="box card"><h2>${reg?'Create account':'Sign in'}</h2><div class="tabs"><button class="${mode=='customer'?'on':''}" onclick="setMode('customer')">Customer</button><button class="${mode=='owner'?'on':''}" onclick="setMode('owner')">Store owner</button></div>${reg?'<label>Name</label><input id="n">':''}<label>Email</label><input id="e" type="email"><label>Password</label><input id="p" type="password"><button onclick="doAuth()">${reg?'Register':'Enter'}</button> <button class="g" onclick="togReg()">${reg?'Have an account':'New here'}</button></div>`;
async function doAuth(){const e=$('#e').value.trim(),p=$('#p').value,n=$('#n')?.value.trim();if(!e||p.length<6){msg='Enter email and a password of 6+ characters.';return render()}
 try{if(reg){if(!n){msg='Enter your name.';return render()}const c=await A.createUserWithEmailAndPassword(auth,e,p);me=await sv('users',{id:c.user.uid,name:n,email:e,role:mode,banned:false})}
 else{const c=await A.signInWithEmailAndPassword(auth,e,p),u=await gd('users',c.user.uid);if(!u||u.role!==mode||u.banned){await A.signOut(auth);msg=u?.banned?'This account has been banned.':'Wrong account type for this tab.';return render()}me=u}}
 catch(x){msg=x.code==='auth/email-already-in-use'?'Email already registered.':'Could not sign in: check your details.';return render()}
 go(me.role==='owner'?'dash':'home')}
async function shop(){const s=await gd('shops',V.id);if(!s||!live(s))return'<p>Shop unavailable.</p>';const ps=await ld('products','shopId',s.id),r=await avg(s.id);
 return`<div class="shophead t-${s.theme}"><h1>${esc(s.name)}</h1><p class="mut">${esc(s.desc)}</p>${r.n?stars5(r.a)+` ${r.a.toFixed(1)} (${r.n} reviews)`:'No reviews yet'}</div><h2>Products</h2><div class="grid">${ps.map(p=>`<div class="card"><h3>${esc(p.name)}</h3><p class="mut">${esc(p.desc)}</p><div class="row"><b>${fmt(p.price)}</b>${me?.role==='customer'?`<button onclick="add('${s.id}','${p.id}')">Add to cart</button>`:''}</div></div>`).join('')||'<p class="mut">No products yet.</p>'}</div>${me?.role!=='customer'?'<p class="mut">Sign in as a customer to order.</p>':''}
 <h2>Reviews</h2>${r.rv.map(x=>`<div class="card">${stars5(x.rating)} <b>${esc(x.name)}</b><p>${esc(x.text)}</p></div>`).join('')||'<p class="mut">Be the first to review.</p>'}
 ${me?.role==='customer'?`<div class="card"><h3>Rate this shop</h3><select id="rt">${[5,4,3,2,1].map(i=>`<option>${i}</option>`).join('')}</select><textarea id="rx" placeholder="Your review"></textarea><div class="row"><button onclick="rev('${s.id}')">Submit review</button><button class="g" onclick="rep('${s.id}')">Report fraud</button></div></div>`:''}`}
const rev=async id=>{await sv('reviews',{shopId:id,uid:me.id,name:me.name,rating:+$('#rt').value,text:$('#rx').value.trim(),ts:Date.now()});render()};
const rep=async id=>{await sv('reports',{shopId:id,by:me.id,ts:Date.now()});msg='Report sent to the admin.';render()};
async function add(sid,pid){const p=(await ld('products','shopId',sid)).find(x=>x.id===pid);if(cart.shop&&cart.shop!==sid)cart.items=[];cart.shop=sid;const i=cart.items.find(x=>x.id===pid);i?i.q++:cart.items.push({id:pid,name:p.name,price:p.price,q:1,ownerId:p.ownerId});save();msg='Added to cart.';render()}
const rmItem=k=>{cart.items.splice(k,1);save();render()};
async function cartV(){if(!cart.items.length)return'<h2>Your cart</h2><p class="mut">Empty.</p>';const t=cart.items.reduce((a,i)=>a+i.price*i.q,0);
 return`<h2>Your cart</h2>${cart.items.map((i,k)=>`<div class="card row"><span>${esc(i.name)} × ${i.q}</span><span>${fmt(i.price*i.q)} <button class="g" onclick="rmItem(${k})">Remove</button></span></div>`).join('')}<h3>Total ${fmt(t)} <span class="mut">· pay the shop on delivery</span></h3><label>Delivery address</label><textarea id="ad"></textarea><label>Phone</label><input id="ph"><button onclick="order(${t})">Place order</button>`}
async function order(t){const ad=$('#ad').value.trim(),ph=$('#ph').value.trim();if(!ad||!ph){msg='Add address and phone.';return render()}
 await sv('orders',{shopId:cart.shop,ownerId:cart.items[0].ownerId,cid:me.id,cname:me.name,items:cart.items,total:t,address:ad,phone:ph,status:'New',ts:Date.now()});cart={shop:null,items:[]};save();go('orders');msg='Order placed! Pay on delivery.'}
async function orders(){const o=(await ld('orders','cid',me?.id)).sort((a,b)=>b.ts-a.ts);return`<h2>My orders</h2>${o.map(x=>`<div class="card"><span class="pill">${x.status}</span> ${fmt(x.total)}<p class="mut">${x.items.map(i=>esc(i.name)+'×'+i.q).join(', ')}</p></div>`).join('')||'<p class="mut">None yet.</p>'}`}
async function dash(){if(me?.role!=='owner')return'<p>Owner access only.</p>';me=await gd('users',me.id);const s=(await ld('shops','ownerId',me.id))[0],ok=!cfg.subOn||me.paidUntil>Date.now();
 const pay=`<div class="card"><h3>Monthly subscription: ${fmt(cfg.price)}</h3><p class="mut" style="white-space:pre-wrap">${esc(cfg.bank)||'Payment details not set yet.'}</p><input id="rf" placeholder="Payment reference / sender name"><button onclick="paid()">I have paid</button></div>`;
 if(!s){const pm=(await ld('payments','ownerId',me.id)).find(x=>!x.done);return`<h2>Open your shop</h2>${ok?'':(pm?'<div class="card">Payment submitted — waiting for admin approval.</div>':pay)}${ok?`<div class="card"><label>Shop name</label><input id="sn"><label>Description</label><textarea id="sd"></textarea><label>Look</label><select id="st"><option value="nebula">Nebula</option><option value="eclipse">Eclipse</option><option value="pulsar">Pulsar</option></select><button onclick="mk()">Create shop</button></div>`:''}`}
 const ps=await ld('products','shopId',s.id),os=(await ld('orders','ownerId',me.id)).sort((a,b)=>b.ts-a.ts);
 return`<div class="shophead t-${s.theme}"><h1>${esc(s.name)}</h1><div class="row"><span class="mut">${cfg.subOn?(ok?'Active until '+new Date(s.paidUntil).toDateString():'Subscription expired — renew to stay visible'):'Subscriptions are off'}</span><button class="g" onclick="go('shop','${s.id}')">View shop</button></div></div>${cfg.subOn&&s.paidUntil<Date.now()?pay:''}
 <h2>Add product</h2><div class="card"><input id="pn" placeholder="Name"><input id="pp" type="number" placeholder="Price (₦)"><textarea id="pd" placeholder="Description"></textarea><button onclick="ap('${s.id}')">Add product</button></div><div class="grid">${ps.map(p=>`<div class="card"><b>${esc(p.name)}</b> · ${fmt(p.price)}<p class="mut">${esc(p.desc)}</p><button class="g" onclick="delP('${p.id}')">Delete</button></div>`).join('')}</div>
 <h2>Orders</h2>${os.map(o=>`<div class="card"><div class="row"><b>${esc(o.cname)} · ${fmt(o.total)}</b><select onchange="stt('${o.id}',this.value)">${['New','Packed','Sent','Delivered','Cancelled'].map(x=>`<option ${x==o.status?'selected':''}>${x}</option>`).join('')}</select></div><p class="mut">${o.items.map(i=>esc(i.name)+'×'+i.q).join(', ')}<br>${esc(o.address)} · ${esc(o.phone)}</p></div>`).join('')||'<p class="mut">No orders yet.</p>'}`}
const paid=async()=>{await sv('payments',{ownerId:me.id,name:me.name,ref:$('#rf').value.trim(),ts:Date.now(),done:false});render()};
const mk=async()=>{const n=$('#sn').value.trim();if(!n){msg='Name your shop.';return render()}await sv('shops',{ownerId:me.id,name:n,desc:$('#sd').value.trim(),theme:$('#st').value,paidUntil:me.paidUntil||0,banned:false});render()};
const ap=async sid=>{const n=$('#pn').value.trim();if(!n)return;await sv('products',{shopId:sid,ownerId:me.id,name:n,price:+$('#pp').value||0,desc:$('#pd').value.trim()});render()};
const delP=async id=>{await rm('products',id);render()};
const stt=async(id,v)=>{const o=(await ld('orders','ownerId',me.id)).find(x=>x.id===id);o.status=v;await sv('orders',o)};
Object.assign(window,{go,out,setMode,togReg,doAuth,rev,rep,add,rmItem,order,paid,mk,ap,delP,stt});
stars();cfg=await getCfg();
A.onAuthStateChanged(auth,async u=>{me=null;if(u){const d=await gd('users',u.uid);if(d&&!d.banned)me=d}render()});
</script></body></html>
